<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Demo - 导出JSON</title>
<link href="../Content/css/aiflow.css" rel="stylesheet"/>
<script src="../Content/es6/raphael.min.js"></script>
<script src="../Content/es6/aiflow-router.js"></script>
<script type="module" src="../Content/es6/index.js"></script>
<style>.demo-panel{position:fixed;top:10px;right:60px;z-index:999;background:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;max-width:360px;} .demo-panel h4{margin:0 0 8px;font-size:14px;color:#1890ff;} .demo-btn{padding:6px 14px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:4px 2px;} .demo-btn:hover{background:#40a9ff;} #json-output{max-height:200px;overflow:auto;background:#f5f5f5;padding:8px;border-radius:4px;font-size:11px;margin-top:8px;white-space:pre;}</style>
</head>
<body>
<div id="aiflow-page"></div>
<div class="demo-panel">
  <h4>导出 JSON Demo</h4>
  <p>先拖拽创建一些节点和连线，然后点击"导出JSON"。</p>
  <button class="demo-btn" id="btn-export">导出JSON到控制台</button>
  <button class="demo-btn" id="btn-export-show">导出并显示</button>
  <div id="json-output"></div>
</div>
<script type="module">
import { AiFlow } from '../Content/es6/index.js';

var designer = AiFlow.init(document.getElementById('aiflow-page'), { title: '导出JSON Demo' });
  designer.addNode('start', 200, 100);
  designer.addNode('userTask', 200, 250, { name: '用户审批' });

  document.getElementById('btn-export').addEventListener('click', function(){
    var json = designer.exportJSON();
    console.log('导出JSON:', json);
    alert('已导出到控制台，按F12查看');
  });
  document.getElementById('btn-export-show').addEventListener('click', function(){
    var json = designer.exportJSON();
    document.getElementById('json-output').textContent = JSON.stringify(json, null, 2);
  });
</script>
</body>
</html>
