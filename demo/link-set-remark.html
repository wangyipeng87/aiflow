<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Demo - 修改连线备注</title>
<link href="../Content/css/aiflow.css" rel="stylesheet"/>
<script src="../Content/es6/raphael.min.js"></script>
<script src="../Content/es6/aiflow-router.js"></script>
<script type="module" src="../Content/es6/index.js"></script>
<style>.demo-panel{position:fixed;top:10px;right:60px;z-index:999;background:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;max-width:320px;} .demo-panel h4{margin:0 0 8px;font-size:14px;color:#1890ff;} .demo-btn{padding:6px 14px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:4px 2px;} .demo-btn:hover{background:#40a9ff;} input.demo-input{padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;width:180px;margin:4px 0;}</style>
</head>
<body>
<div id="aiflow-page"></div>
<div class="demo-panel">
  <h4>修改连线备注 Demo</h4>
  <input class="demo-input" id="remark-input" value="申请金额>100元" placeholder="输入备注"/>
  <button class="demo-btn" id="btn-set-remark">修改备注</button>
</div>
<script type="module">
import { AiFlow } from '../Content/es6/index.js';

var designer = AiFlow.init(document.getElementById('aiflow-page'), { title: '连线备注Demo' });
  var n1 = designer.addNode('start', 250, 100);
  var n2 = designer.addNode('userTask', 230, 280, { name: '审批' });
  var link = designer._addLink(n1.id, 'bottom', n2.id, 'top');

  document.getElementById('btn-set-remark').addEventListener('click', function(){
    if (link) link.setRemark(document.getElementById('remark-input').value);
  });
</script>
</body>
</html>
