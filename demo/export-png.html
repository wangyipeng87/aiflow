<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Demo - 导出PNG</title>
<link href="../Content/css/aiflow.css" rel="stylesheet"/>
<script src="../Content/es6/raphael.min.js"></script>
<script src="../Content/es6/aiflow-router.js"></script>
<script type="module" src="../Content/es6/index.js"></script>
<style>.demo-panel{position:fixed;top:10px;right:60px;z-index:999;background:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;max-width:320px;} .demo-panel h4{margin:0 0 8px;font-size:14px;color:#1890ff;} .demo-btn{padding:6px 14px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:4px 2px;} .demo-btn:hover{background:#40a9ff;} #preview{margin-top:8px;max-width:280px;border:1px solid #eee;border-radius:4px;}</style>
</head>
<body>
<div id="aiflow-page"></div>
<div class="demo-panel">
  <h4>导出 PNG Demo</h4>
  <button class="demo-btn" id="btn-download">下载PNG</button>
  <button class="demo-btn" id="btn-preview">预览PNG</button>
  <div><img id="preview" style="display:none"/></div>
</div>
<script type="module">
import { AiFlow } from '../Content/es6/index.js';

var designer = AiFlow.init(document.getElementById('aiflow-page'), { title: '导出PNG Demo' });
  designer.addNode('start', 200, 80);
  designer.addNode('userTask', 180, 220, { name: '提交申请' });
  designer.addNode('end', 200, 380);

  document.getElementById('btn-download').addEventListener('click', function(){ designer.exportPNG(); });
  document.getElementById('btn-preview').addEventListener('click', function(){
    designer.exportPNG(function(dataURL){
      var img = document.getElementById('preview');
      img.src = dataURL;
      img.style.display = 'block';
    });
  });
</script>
</body>
</html>
