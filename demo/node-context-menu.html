<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Demo - 自定义节点右键菜单</title>
<link href="../Content/css/aiflow.css" rel="stylesheet"/>
<script src="../Content/es6/raphael.min.js"></script>
<script src="../Content/es6/aiflow-router.js"></script>
<script type="module" src="../Content/es6/index.js"></script>
<style>.demo-panel{position:fixed;top:10px;right:60px;z-index:999;background:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;max-width:360px;} .demo-panel h4{margin:0 0 8px;font-size:14px;color:#1890ff;} .demo-panel code{display:block;background:#f5f5f5;padding:8px;border-radius:4px;white-space:pre;font-size:11px;margin-top:6px;}</style>
</head>
<body>
<div id="aiflow-page"></div>
<div class="demo-panel">
  <h4>自定义节点右键菜单 Demo</h4>
  <p>右键点击节点查看自定义菜单。</p>
  <code>designer.setNodeContextMenu([
  { name:'编辑', action:'edit',
    callback: fn },
  { name:'复制', action:'copy',
    callback: fn },
  { name:'删除', action:'delete' }
]);</code>
</div>
<script type="module">
import { AiFlow } from '../Content/es6/index.js';

var designer = AiFlow.init(document.getElementById('aiflow-page'), {
    title: '节点右键菜单Demo',
    events: {
      onContextMenuClick: function(d) { console.log('菜单点击:', d); }
    }
  });
  designer.addNode('userTask', 250, 200, { name: '右键点击我' });
  designer.addNode('systemTask', 450, 200, { name: '我也可以' });

  designer.setNodeContextMenu([
    { name: '编辑节点', action: 'edit', callback: function(node) { alert('编辑节点: ' + node.name); } },
    { name: '查看详情', action: 'detail', callback: function(node) { alert('ID: ' + node.id + '\n名称: ' + node.name); } },
    { name: '删除', action: 'delete' }
  ]);
</script>
</body>
</html>
