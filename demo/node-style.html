<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Demo - 节点样式配置</title>
<link href="../Content/css/aiflow.css" rel="stylesheet"/>
<script src="../Content/es6/raphael.min.js"></script>
<script src="../Content/es6/aiflow-router.js"></script>
<script type="module" src="../Content/es6/index.js"></script>
<style>.demo-panel{position:fixed;top:10px;right:60px;z-index:999;background:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;max-width:360px;} .demo-panel h4{margin:0 0 8px;font-size:14px;color:#1890ff;} .demo-btn{padding:6px 14px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:4px 2px;} .demo-btn:hover{background:#40a9ff;}</style>
</head>
<body>
<div id="aiflow-page"></div>
<div class="demo-panel">
  <h4>节点样式配置 Demo</h4>
  <p>点击按钮修改节点样式。</p>
  <button class="demo-btn" id="btn-style1">橙色主题</button>
  <button class="demo-btn" id="btn-style2">紫色主题</button>
  <button class="demo-btn" id="btn-style3">恢复默认</button>
</div>
<script type="module">
import { AiFlow } from '../Content/es6/index.js';

var designer = AiFlow.init(document.getElementById('aiflow-page'), { title: '节点样式Demo' });
  var node = designer.addNode('userTask', 250, 200, { name: '测试节点' });

  document.getElementById('btn-style1').addEventListener('click', function(){
    node.setStyle({ fill: '#fff7e6', stroke: '#fa8c16', textStyle: { fill: '#ad4e00', 'font-weight': 'bold' } });
  });
  document.getElementById('btn-style2').addEventListener('click', function(){
    node.setStyle({ fill: '#f9f0ff', stroke: '#722ed1', textStyle: { fill: '#531dab', 'font-weight': 'bold' } });
  });
  document.getElementById('btn-style3').addEventListener('click', function(){
    node.setStyle({ fill: '#e6f7ff', stroke: '#1890ff', textStyle: { fill: '#333', 'font-weight': 'normal' } });
  });
</script>
</body>
</html>
