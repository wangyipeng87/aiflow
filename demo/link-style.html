<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Demo - 连线样式配置</title>
<link href="../Content/css/aiflow.css" rel="stylesheet"/>
<script src="../Content/es6/raphael.min.js"></script>
<script src="../Content/es6/aiflow-router.js"></script>
<script type="module" src="../Content/es6/index.js"></script>
<style>.demo-panel{position:fixed;top:10px;right:60px;z-index:999;background:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px;max-width:360px;} .demo-panel h4{margin:0 0 8px;font-size:14px;color:#1890ff;} .demo-btn{padding:6px 14px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:4px 2px;} .demo-btn:hover{background:#40a9ff;}</style>
</head>
<body>
<div id="aiflow-page"></div>
<div class="demo-panel">
  <h4>连线样式配置 Demo</h4>
  <p>点击按钮修改连线颜色。</p>
  <button class="demo-btn" id="btn-red">红色连线</button>
  <button class="demo-btn" id="btn-green">绿色连线</button>
  <button class="demo-btn" id="btn-default">恢复默认</button>
</div>
<script type="module">
import { AiFlow } from '../Content/es6/index.js';

var designer = AiFlow.init(document.getElementById('aiflow-page'), { title: '连线样式Demo' });
  var n1 = designer.addNode('start', 250, 100);
  var n2 = designer.addNode('userTask', 230, 280, { name: '审批' });
  var link = designer._addLink(n1.id, 'bottom', n2.id, 'top');

  document.getElementById('btn-red').addEventListener('click', function(){ if(link) link.setStyle({ stroke: '#f5222d', strokeWidth: 3 }); });
  document.getElementById('btn-green').addEventListener('click', function(){ if(link) link.setStyle({ stroke: '#52c41a', strokeWidth: 2 }); });
  document.getElementById('btn-default').addEventListener('click', function(){ if(link) link.setStyle({ stroke: '#1890ff', strokeWidth: 2 }); });
</script>
</body>
</html>
